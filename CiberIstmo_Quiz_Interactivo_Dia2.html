const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function clearTick(){if(tick){clearInterval(tick);tick=null;}state.timerRunning=false;}
function fmtTime(t){return `${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')}`;}
function elapsed(){if(state.remaining>0){state.remaining--;document.getElementById('timeValue')?.replaceChildren(document.createTextNode(fmtTime(state.remaining)));if(state.remaining===0){clearTick();document.getElementById('timeValue')?.classList.add('urgent');}}}
function toggleTimer(){if(state.timerRunning){clearTick()}else{if(state.remaining<=0)state.remaining=state.timeLimit;state.timerRunning=true;tick=setInterval(elapsed,1000);}updateTimerButton();}
function updateTimerButton(){const b=document.getElementById('timerToggle');if(b)b.textContent=state.timerRunning?'⏸ Pausar':'▶ Iniciar tiempo';}
function resetTimer(){clearTick();state.remaining=state.timeLimit;const e=document.getElementById('timeValue');if(e){e.textContent=fmtTime(state.remaining);e.classList.remove('urgent');}updateTimerButton()}
function viewHome(){clearTick();state.view='home';render();}
function startSession(block=null,random=false){clearTick();const available=items.map((_,i)=>i).filter(i=>block===null||items[i].b===block);if(random)for(let i=available.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[available[i],available[j]]=[available[j],available[i]];}state={...state,view:'play',queue:available,block,pos:0,score:0,correct:0,answered:0,selection:[],revealed:false,checked:false,taskChecks:[],remaining:state.timeLimit,history:[]};render();}
function goItem(index){if(index<0||index>=state.queue.length)return;clearTick();state.pos=index;state.selection=[];state.revealed=false;state.checked=false;state.taskChecks=[];state.remaining=state.timeLimit;state.view='play';render();}
function next(){if(state.pos+1<state.queue.length)goItem(state.pos+1);else{clearTick();state.view='results';render();}}
function prev(){goItem(state.pos-1)}
function isPractice(i){return i.type==='practice'}
function current(){return items[state.queue[state.pos]]}
function choose(n){if(state.revealed)return;const item=current();if(item.type==='multi'){state.selection=state.selection.includes(n)?state.selection.filter(x=>x!==n):[...state.selection,n]}else state.selection=[n];render();}
function reveal(){const item=current();if(state.revealed)return;clearTick();state.revealed=true;let earned=0;let right=false;if(!isPractice(item)){right=JSON.stringify([...state.selection].sort())===JSON.stringify((Array.isArray(item.answer)?item.answer:[item.answer]).slice().sort());if(right){earned=Math.max(100,100+state.remaining*10);state.score+=earned;state.correct++;}state.answered++;}else{right=state.taskChecks.length===item.steps.length;earned=right?250:0;state.score+=earned;state.answered++;if(right)state.correct++;}state.history.push({idx:state.queue[state.pos],right,earned,chosen:state.selection.slice(),taskCount:state.taskChecks.length});render();}
function checkTask(i,yes){state.taskChecks=yes?[...state.taskChecks,i]:state.taskChecks.filter(n=>n!==i);render();}
function newTime(val){clearTick();state.timeLimit=Number(val);state.remaining=Number(val);render();}
function render(){document.getElementById('liveStatus').textContent=state.view==='home'?'🎯 Modo instructor':state.view==='results'?'🏁 Resultados':`🏆 ${state.score} pts`;if(state.view==='home')renderHome();if(state.view==='play')renderPlay();if(state.view==='results')renderResults();}
function renderHome(){const counts=blocks.map((_,b)=>items.filter(i=>i.b===b).length);el.innerHTML=`<section class="screenHead"><div><span class="eyebrow">Bienvenidos a la arena</span><h1>¡Sube de nivel y explora las redes!</h1></div><div class="stats"><div class="stat"><b>${items.length}</b><small>actividades</small></div><div class="stat"><b>6</b><small>bloques</small></div></div></section><section class="content"><div class="homeintro"><div class="typeBadge">Día 1 · Redes y sistemas operativos</div><h2 class="heroTitle">Aprende. Explora.<br><em>¡Responde!</em> 🎮</h2><p class="lede">Juego de clase para proyectar. El instructor lee la pregunta, el grupo debate y elige una respuesta. Al revelarla se muestra la explicación técnica. Las prácticas se hacen en los equipos de laboratorio.</p></div><div class="blocks">${blocks.map((b,i)=>`<button class="blockCard" data-start="${i}"><div class="num">BLOQUE ${i+1} · ${counts[i]} actividades</div><h3>${b.icon} ${escapeHTML(b.label)}</h3><small>${escapeHTML(b.desc)}</small></button>`).join('')}</div><div class="homeactions"><button class="btn primary" id="startAll">▶ Comenzar recorrido completo</button><button class="btn" id="startRandom">🔀 Mezclar todas las actividades</button><button class="btn" id="howBtn">ℹ Cómo jugar</button><label class="pill modeSwitch">⏱ Tiempo por pregunta: <select id="timeSelect" style="background:#203c62;border:1px solid #516b8a;color:white;border-radius:7px;padding:4px 6px"><option value="20">20 s</option><option value="30" selected>30 s</option><option value="45">45 s</option><option value="60">60 s</option><option value="90">90 s</option></select></label></div><p class="smallNote" style="margin-top:20px">Diseñado para uso presencial: no se conecta con teléfonos ni recopila respuestas remotas. El puntaje se calcula por las selecciones realizadas en este navegador. Cada reto del CTF externo es independiente.</p></section>`;el.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>startSession(Number(b.dataset.start))));document.getElementById('startAll').onclick=()=>startSession();document.getElementById('startRandom').onclick=()=>startSession(null,true);document.getElementById('howBtn').onclick=help;document.getElementById('timeSelect').value=state.timeLimit;document.getElementById('timeSelect').onchange=e=>newTime(e.target.value);}
function renderPlay(){const i=current(),pos=state.pos+1,total=state.queue.length,practice=isPractice(i);const opts=practice?'':`<div class="choiceGrid" role="group" aria-label="Respuestas posibles">${i.opts.map((o,n)=>{let status=state.revealed&&([i.answer].flat().includes(n))?' correct':state.revealed&&state.selection.includes(n)?' wrong':state.selection.includes(n)?' sel':'';return `<button class="choice${status}" data-choice="${n}" aria-pressed="${state.selection.includes(n)}" ${state.revealed?'disabled':''}><span class="letter">${String.fromCharCode(65+n)}</span><span>${escapeHTML(o)}</span></button>`}).join('')}</div>`;
const practical=practice?`<p class="prompt">${escapeHTML(i.description)}</p><div class="practiceBox"><div class="terminalHead">⌨ Terminal · práctica de laboratorio</div><div class="commands">${escapeHTML(i.commands)}</div></div><div class="practiceList">${i.steps.map((s,n)=>`<label class="task"><input type="checkbox" data-task="${n}" ${state.taskChecks.includes(n)?'checked':''} ${state.revealed?'disabled':''}><span>${escapeHTML(s)}</span></label>`).join('')}</div><span class="tag">Completa los pasos sobre tu equipo. Los checks son de seguimiento del instructor.</span>`:opts;
let feedback='';if(state.revealed){const entry=state.history[state.history.length-1];feedback=`<div class="feedback ${entry.right?'good':''}">${entry.right?'✅ ¡Muy bien!':'💡 Respuesta para analizar'} ${practice?`Completaste ${entry.taskCount} de ${i.steps.length} pasos.`:entry.right?`+${entry.earned} puntos por respuesta correcta.`:'Compara la selección del grupo con las opciones marcadas en verde.'}</div><div class="explanation"><h3>🧠 Explicación de la respuesta</h3><p>${escapeHTML(i.why)}</p>${i.tip?`<div class="tip">🔍 Para profundizar: ${escapeHTML(i.tip)}</div>`:''}</div>`;}

el.innerHTML=body;el.querySelectorAll('[data-choice]').forEach(o=>o.onclick=()=>choose(Number(o.dataset.choice)));el.querySelectorAll('[data-task]').forEach(o=>o.onchange=e=>checkTask(Number(o.dataset.task),e.target.checked));document.getElementById('homeBtn').onclick=viewHome;document.getElementById('prevBtn').onclick=prev;const rv=document.getElementById('revealBtn');if(rv)rv.onclick=reveal;const nx=document.getElementById('nextBtn');if(nx)nx.onclick=next;const t=document.getElementById('timerToggle');if(t)t.onclick=toggleTimer;const tr=document.getElementById('timerReset');if(tr)tr.onclick=resetTimer;}

function showOverlay(html){overlay.style.display='block';overlay.className='menuOverlay';overlay.innerHTML=`<div class="menu" role="dialog" aria-modal="true">${html}<div style="margin-top:16px"><button class="btn primary" id="closeOverlay">Cerrar</button></div></div>`;document.getElementById('closeOverlay').onclick=closeOverlay;overlay.onclick=e=>{if(e.target===overlay)closeOverlay();};}
function help(){showOverlay(`<h2>🎮 Cómo jugar en vivo</h2><p class="smallNote">1. Elige un bloque o inicia todo el recorrido.<br>2. Proyecta la pregunta y deja al grupo debatir o votar a mano alzada.<br>3. Selecciona la opción acordada; puedes activar el cronómetro.<br>4. Pulsa <b>Revelar y explicar</b> para mostrar la respuesta correcta, el porqué y los puntos.<br>5. En las prácticas, los estudiantes ejecutan los comandos en sus computadoras y el instructor marca los pasos realizados.</p><p class="smallNote">El HTML funciona offline en un solo equipo. No ofrece conexión simultánea, PIN de sala ni votación desde móviles.</p>`);}
function jump(){let html=`<h2>☷ Ir a una actividad</h2><p class="smallNote">Selecciona cualquier ejercicio. Se conservan los puntos registrados, pero al regresar a una actividad no se repone automáticamente su respuesta anterior.</p><div class="jumpRows">${items.map((x,i)=>`<button data-jump="${i}"><small style="color:#8db8d9">${blocks[x.b].short}${x.type==='practice'?' · PRÁCTICA':''}</small> — ${escapeHTML(x.q)}</button>`).join('')}</div>`;showOverlay(html);overlay.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{let index=Number(b.dataset.jump);if(state.view!=='play'||!state.queue.includes(index)){startSession();}goItem(state.queue.indexOf(index));closeOverlay();});}
document.getElementById('jumpBtn').onclick=jump;
document.getElementById('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.();};document.getElementById('resetBtn').onclick=()=>{if(confirm('¿Reiniciar el juego y borrar la puntuación de esta sesión?')){clearTick();state={...state,view:'home',selection:[],revealed:false,pos:0,score:0,history:[],taskChecks:[],timeLimit:30,remaining:30};closeOverlay();render();}};
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLSelectElement)return;if(overlay.style.display==='block'){if(e.key==='Escape')closeOverlay();return;}if(e.key.toLowerCase()==='f'){e.preventDefault();document.getElementById('fullBtn').click();return;}if(state.view!=='play')return;if(/^[1-4]$/.test(e.key)&&!state.revealed&&!isPractice(current()))choose(Number(e.key)-1);else if(e.key==='Enter'&&!state.revealed){e.preventDefault();reveal();}else if(e.key==='ArrowRight'&&state.revealed){e.preventDefault();next();}else if(e.key==='ArrowLeft'&&state.pos>0){e.preventDefault();prev();}});
render();
</script></body></html>
